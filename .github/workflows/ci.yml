name: Continuous Integration

on:
  push:
    branches: [ master ]
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install pandas matplotlib

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libfontconfig1 libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          pkgs <- c('ggplot2', 'svglite', 'jsonlite', 'digest')
          install.packages(pkgs, repos='https://cloud.r-project.org')
          missing <- pkgs[!pkgs %in% installed.packages()[,'Package']]
          if (length(missing) > 0) stop('Failed to install: ', paste(missing, collapse=', '))
        shell: Rscript {0}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Record runtime versions
        run: |
          rustc --version
          cargo --version
          python3 --version
          python3 -m pip freeze
          Rscript -e 'sessionInfo(); print(sapply(c("ggplot2", "svglite", "jsonlite", "digest"), function(p) as.character(packageVersion(p))))'

      - name: Run workspace tests (no Typst required)
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/knot-matplotlib
        run: cargo test --workspace --locked

      - name: Run knot-core integration tests (R and Python)
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/knot-matplotlib
        run: cargo test -p knot-core --locked -- --ignored

      - name: Setup Typst for PDF integration tests
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'

      - name: Run CLI PDF integration tests
        run: |
          typst --version
          cargo test -p knot-cli --locked --test integration_pdf -- --ignored


  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Compile extension
        working-directory: editors/vscode
        run: npm run compile

      - name: Check types and lint
        working-directory: editors/vscode
        run: |
          node --version
          npm --version
          npm ls --depth=0
          npm run typecheck
          npm run lint
          npm test

      - name: Verify package can be created
        working-directory: editors/vscode
        run: |
          npm exec -- vsce package --out test.vsix
